name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  # ─── Pre-build checks (no build needed) ─────────────────────
  check-articles:
    name: Article validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check article format & FR/EN parity
        run: python3 scripts/check-articles.py

  lint:
    name: Astro check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Astro check
        run: pnpm exec astro check

  # ─── Build (depends on pre-build checks) ────────────────────
  build:
    name: Build
    needs: [check-articles, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Post-build checks (need dist/) ─────────────────────────
  check-html:
    name: HTML & links validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check HTML structure, JSON-LD & internal links
        run: python3 scripts/check-html.py dist || echo "::warning::HTML checks found issues (see above)"

  html-validate:
    name: HTML W3C validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install html-validate
        run: npm install -g html-validate
      - name: Validate HTML
        run: html-validate "dist/**/*.html" --config '{"extends":["html-validate:recommended"],"rules":{"no-trailing-whitespace":"off","tel-non-breaking":"off","prefer-native-element":"off"}}' || true

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Run Lighthouse
        run: |
          lhci autorun \
            --collect.staticDistDir=dist \
            --collect.url=/ \
            --collect.url=/posts/ \
            --collect.url=/about/ \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:accessibility="warn" \
            --assert.assertions.categories:best-practices="warn" \
            --assert.assertions.categories:seo="warn" \
            --upload.target=temporary-public-storage || true
