<!-- Bouton flottant -->
<div class="chat-button" id="chatButton">
    <svg class="chat-icon" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
    </svg>
    <svg class="close-icon" viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
</div>

<!-- Conteneur du chatbot -->
<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <div>
            <h3>Assistant Virtual</h3>
            <p>Posez vos questions</p>
        </div>
        <button class="close-btn" id="closeBtn">×</button>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="message-content">
                Bonjour ! 👋 Je suis là pour vous aider à en savoir plus sur mes compétences et mes projets. Posez-moi une question ou cliquez sur un sujet ci-dessous.
            </div>
        </div>
    </div>

    <div class="quick-replies" id="quickReplies">
        <button class="quick-reply-btn" data-question="DevOps">DevOps</button>
        <button class="quick-reply-btn" data-question="Kubernetes">Kubernetes</button>
        <button class="quick-reply-btn" data-question="Projets">Projets</button>
        <button class="quick-reply-btn" data-question="Contact">Contact</button>
        <button class="quick-reply-btn" data-question="CV">CV</button>
    </div>

    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Tapez votre question...">
        <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>
